<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Soundcraft Solo Boost</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            position: relative;
        }

        #connection-status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
            z-index: 1000;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
            min-width: 120px;
        }

        button:hover {
            background-color: #005a9e;
        }
    </style>
</head>

<body>
    <div id="connection-status">Status: Disconnected</div>
    <input type="number" id="channelInput" placeholder="Channel Number" min="1" max="24" style="margin-bottom: 10px; padding: 10px; font-size: 16px; width: 150px;">
    <button id="muteToggleButton" onclick="toggleMuteFromInput()">Mute 1</button>
    <button id="boost3dBButton" onclick="toggle3dBBoost()">Boost 3dB: OFF</button>
    <script src="renderer.js" type="module"></script>
</body>

</html>
