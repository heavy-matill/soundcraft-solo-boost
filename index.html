<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Soundcraft Solo Boost</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            position: relative;
        }

        #connection-status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
            z-index: 1000;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
            min-width: 120px;
        }

        button:hover {
            background-color: #005a9e;
        }
    </style>
</head>

<body>
    <div id="connection-status">Status: Disconnected</div>
    <button id="boostButton">Solo Boost</button>
    <button onclick="mute(1)">Mute 1</button>
    <button onclick="unmute(1)">Unmute 1</button>
    <button id="boost3dBButton" onclick="toggle3dBBoost()">Boost 3dB: OFF</button>
    <script type="module">
        // Require the SoundcraftUI module
        import { SoundcraftUI } from './soundcraft-ui-connection.mjs';

        // Create connection
        const conn = new SoundcraftUI('192.168.1.200');

        // Subscribe to connection status updates
        if (conn.status$) {
            conn.status$.subscribe({
                next: (status) => {
                    document.getElementById('connection-status').textContent = `Status: ${status}`;
                },
                error: (err) => {
                    console.error('Status subscription error:', err);
                    document.getElementById('connection-status').textContent = 'Status: Error';
                }
            });
        } else {
            // Fallback if status$ doesn't exist
            document.getElementById('connection-status').textContent = 'Status: Unknown (no status observable)';
        }

        // Create connection
        (async () => {
            try {
                await conn.connect();
                console.log('Connected to Soundcraft UI');
                // Update status immediately after connect (in case subscription doesn't catch initial state)
                if (document.getElementById('connection-status')) {
                    document.getElementById('connection-status').textContent = 'Status: Connected';
                }
            } catch (err) {
                console.error('Connection error:', err);
                document.getElementById('connection-status').textContent = 'Status: Connection Failed';
            }
        })();

        // Define mute/unmute functions
        window.mute = function (ch) {
            if (conn && conn.master && conn.master.input) {
                conn.master.input(ch).mute();
            }
        };

        window.unmute = function (ch) {
            if (conn && conn.master && conn.master.input) {
                conn.master.input(ch).unmute();
            }
        };

        // Toggle 3dB boost on channel 1
        let is3dBBoostActive = false;
        window.toggle3dBBoost = function () {
            if (!conn || !conn.master || !conn.master.input) {
                console.error('Soundcraft UI connection not ready');
                return;
            }

            const channel1 = conn.master.input(1);
            if (!channel1) {
                console.error('Channel 1 not available');
                return;
            }

            if (is3dBBoostActive) {
                // Turn off: subtract 3dB
                channel1.changeFaderLevelDB(-3);
                is3dBBoostActive = false;
                document.getElementById('boost3dBButton').textContent = 'Boost 3dB: OFF';
            } else {
                // Turn on: add 3dB
                channel1.changeFaderLevelDB(3);
                is3dBBoostActive = true;
                document.getElementById('boost3dBButton').textContent = 'Boost 3dB: ON';
            }

            if (window.ipcRenderer) {
                window.ipcRenderer.send('show-boost-notification', {
                    isActive: is3dBBoostActive
                });
            }
        };
    </script>
    <script>
        // You can add button functionality here if needed
        document.getElementById('boostButton').addEventListener('click', () => {
            alert('Solo Boost activated!');
        });

        // Listen for IPC message from main process to toggle 3dB boost via global shortcut
        if (typeof require !== 'undefined' && require('electron')) {
            const { ipcRenderer } = require('electron');
            window.ipcRenderer = ipcRenderer;
            ipcRenderer.on('toggle-3db-boost', (event) => {
                console.log('Received IPC message to toggle 3dB boost');
                if (typeof window.toggle3dBBoost === 'function') {
                    window.toggle3dBBoost();
                }
            });
        }
    </script>
</body>

</html>
