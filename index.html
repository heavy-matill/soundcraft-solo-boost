<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Soundcraft Solo Boost</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            position: relative;
        }

        #connection-status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
            z-index: 1000;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
            min-width: 120px;
        }

        button:hover {
            background-color: #005a9e;
        }
    </style>
</head>

<body>
    <div id="connection-status">Status: Disconnected</div>
    <button onclick="mute(1)">Mute 1</button>
    <button onclick="unmute(1)">Unmute 1</button>
    <button id="boost3dBButton" onclick="toggle3dBBoost(1)">Boost 3dB: OFF</button>
    <script type="module">
        // Require the SoundcraftUI module
        import { SoundcraftUI } from './soundcraft-ui-connection.mjs';

        // Create connection
        const conn = new SoundcraftUI('192.168.1.200');

        // Subscribe to connection status updates
        conn.status$.subscribe({
            next: (status) => {
                document.getElementById('connection-status').textContent = `Status: ${status}`;
            },
            error: (err) => {
                console.error('Status subscription error:', err);
                document.getElementById('connection-status').textContent = 'Status: Error';
            }
        });

        // Create connection
        await conn.connect()

        // Define mute/unmute functions
        window.mute = function (ch) {
            conn.master.input(ch).mute();
        }

        window.unmute = function (ch) {
            conn.master.input(ch).unmute();
        }

        // Toggle 3dB boost on channel
        let is3dBBoostActive = false;
        window.toggle3dBBoost = function (ch) {

            const channel = conn.master.input(ch);
            if (is3dBBoostActive) {
                // Turn off: subtract 3dB
                channel.changeFaderLevelDB(-3);
                is3dBBoostActive = false;
                document.getElementById('boost3dBButton').textContent = 'Boost 3dB: OFF';
            } else {
                // Turn on: add 3dB
                channel.changeFaderLevelDB(3);
                is3dBBoostActive = true;
                document.getElementById('boost3dBButton').textContent = 'Boost 3dB: ON';
            }
        };
    </script>
</body>

</html>
